# Nginx: tanya-quran.anro128.dev -> container QuranRAG-ID (127.0.0.1:8001)
#
# Pasang di VPS:
#   sudo cp deploy/nginx/tanya-quran.anro128.dev.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/tanya-quran.anro128.dev.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d tanya-quran.anro128.dev     # menambahkan blok HTTPS + redirect otomatis
#
# File ini sengaja hanya berisi blok port 80; certbot yang menambahkan listen 443 dan sertifikatnya.

upstream quranrag_app {
    server 127.0.0.1:8001;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name tanya-quran.anro128.dev;

    # body request kecil (pertanyaan maks. 1000 karakter + riwayat singkat)
    client_max_body_size 256k;

    location / {
        proxy_pass http://quranrag_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # timpa (bukan tambahkan) agar pengguna tidak bisa memalsukan IP lewat header ini
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # jawaban chat dikirim bertahap (Server-Sent Events): jangan di-buffer, beri waktu cukup
    location = /api/chat {
        proxy_pass http://quranrag_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        gzip off;
    }
}
