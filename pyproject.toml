[project]
name = "quranrag-id"
version = "0.1.0"
description = "RAG tanya-jawab Al-Qur'an berbahasa Indonesia"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
# Dependensi runtime: cukup untuk menjalankan server (tanpa torch, muat di VPS 1 GB).
dependencies = [
    "requests>=2.31",
    "tqdm>=4.66",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "lancedb>=0.13",
    "pyarrow>=15",
    "bm25s>=0.2",
    "PyStemmer>=2.2",
    "rapidfuzz>=3.9",
    "onnxruntime>=1.18",
    "sentencepiece>=0.2",
    "openai>=1.40",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
# Langkah build (embedding semua chunk, ekspor ONNX). Pasang di mesin build:
#   pip install torch --index-url https://download.pytorch.org/whl/cpu
#   pip install -e ".[index]"
index = [
    "sentence-transformers>=3.0",
    "onnx>=1.16",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]
