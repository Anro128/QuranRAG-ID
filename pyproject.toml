[project]
name = "quranrag-id"
version = "0.1.0"
description = "RAG tanya-jawab Al-Qur'an berbahasa Indonesia"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "tqdm>=4.66",
    "python-dotenv>=1.0",
    "sentence-transformers>=3.0",
    "lancedb>=0.13",
    "pyarrow>=15",
    "bm25s>=0.2",
    "PyStemmer>=2.2",
    "rapidfuzz>=3.9",
    "openai>=1.40",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]
